# All paths are relative to the repository root.
# Numeric defaults below are starting points; tune them on ESCI-dev only.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/indexes
  results_dir: results
  cache_dir: .cache

data:
  locale: us
  small_version: true
  n_dev: 300
  n_test: 700
  seed: 42
  text_max_chars: 2000       # searchable text per product is cut to this length
  corpus_distractors: 10000  # extra products added to the corpus besides the judged ones

retrieval:
  bm25_k: 100
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  dense_k: 100
  rrf_k: 60

filter:
  mode: lenient          # strict removes violators, lenient subtracts `penalty` per violation
  penalty: 0.5           # lenient: score lost per brand/color/material miss (tune on dev only)
  hard_penalty: 100.0    # lenient: score lost per price/delivery/stock miss; large = sink below
  constraints: [price, delivery, in_stock, brand, color, material]  # which kinds to enforce

rerank:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 50

agent:
  min_good_results: 3
  min_rerank_score: null # set from ESCI-dev
  max_iterations: 2

llm:
  provider: openai_compatible   # any OpenAI-compatible chat endpoint (Ollama, Groq, ...)
  model: null                   # set in .env via LLM_MODEL, e.g. llama3.1 (Ollama) 
  base_url: null                # set in .env via LLM_BASE_URL, e.g. https://<id>.ngrok-free.app/v1
  api_key_env: LLM_API_KEY      # env var holding the key; Ollama accepts any value
  cache_dir: .cache/llm
  temperature: 0.0              # 0 = reproducible answers
  max_tokens: 512
  max_context_products: 5       # how many top products the answer is grounded on
  timeout_seconds: 60.0
  max_retries: 3                # retry transient tunnel/network errors
